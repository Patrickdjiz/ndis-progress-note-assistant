# fly.toml app configuration file generated for ndisnotes-api on 2025-12-30T11:21:56+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ndisnotes-api'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[env]
  PORT = "3000"
  PRIVACY_NOTICE_VERSION = "2026-02-05"


[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long cache for Vite hashed assets
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA: serve index.html for client-side routes
  location / {
    try_files $uri $uri/ /index.html;
  }
}
